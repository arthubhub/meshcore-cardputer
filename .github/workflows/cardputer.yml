name: Cardputer ADV

# Builds for the standalone Cardputer ADV + Cap LoRa project (MeshCore = submodule meshcore/).
#  - release:   when any release is published on GitHub (tag vX.Y.Z recommended, cardputer-vX.Y.Z still
#               accepted), attaches the full-flash images and adds the file list + roadmap summary.
#  - simulator: unit tests of the drivers against fake chips, then every UI scenario twice
#               (direct keys, and through the fake TCA8418 keyboard), uploads the screenshots.
#  - firmware:  builds the PlatformIO envs listed in the matrix, reports RAM/flash,
#               uploads firmware.bin (OTA/update) and firmware-merged.bin (full flash at 0x0).
#  - dual:      standalone + phone companion in one image (firmware-dual.bin, full flash at 0x0).

on:
  push:
    branches: [main]
  release:
    types: [published]       # publish a release from the GitHub site with a new tag, e.g. v0.8.0
  pull_request:
  workflow_dispatch:
  workflow_call:             # used by meshcore-update.yml to check a MeshCore update before it lands
    inputs:
      ref:
        description: branch to build
        type: string
        required: true

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || '' }}
          submodules: true

      - name: Cache LovyanGFX build
        uses: actions/cache@v5
        with:
          path: |
            app/sim/build/LovyanGFX
            app/sim/build/lgfx
            app/sim/build/liblgfx.a
          key: sim-lgfx-${{ hashFiles('app/sim/Makefile') }}

      - name: Roadmap is valid and docs/ROADMAP.md up to date
        run: python3 tools/roadmap.py --check

      - name: Version rules (tools/version.py)
        run: python3 tools/version.py --self-test

      - name: Driver unit tests (fake chips)
        run: make -C app/sim -j4 test

      - name: Build and run scenarios
        run: make -C app/sim -j4 run

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-screenshots
          path: |
            app/sim/build/shots/
            app/sim/build/shots_hw/
          if-no-files-found: ignore

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - cardputer_adv_companion_ble
          - cardputer_adv_standalone
          - cardputer_adv_standalone_map
          - cardputer_adv_demo
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || '' }}
          submodules: true
          fetch-depth: 0       # tags: the firmware version comes from git describe (tools/version.py)

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Firmware and MeshCore versions
        run: |
          echo "Firmware $(python3 tools/version.py), MeshCore $(python3 tools/version.py --meshcore)" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/sync_meshcore_base.py --check

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }} | tee build.log

      - name: Merge flash image
        run: pio run -e ${{ matrix.environment }} -t mergebin

      - name: Memory report
        run: |
          RAM=$(grep -E '^RAM:' build.log | tail -1)
          FLASH=$(grep -E '^Flash:' build.log | tail -1)
          PCT=$(echo "$RAM" | grep -oE '[0-9]+\.[0-9]+%' | head -1 | tr -d '%')
          {
            echo "### ${{ matrix.environment }}"
            echo '```'
            echo "$RAM"
            echo "$FLASH"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$RAM"; echo "$FLASH"
          if [ -n "$PCT" ] && awk "BEGIN{exit !($PCT > 70)}"; then
            echo "::warning title=RAM budget::${{ matrix.environment }} uses ${PCT}% static RAM (budget 70%)"
            echo "**Warning: static RAM above the 70% budget.**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: M5Launcher compatibility
        if: matrix.environment != 'cardputer_adv_companion_ble'
        run: |
          python3 tools/launcher_check.py .pio/build/${{ matrix.environment }}/firmware-merged.bin --strict | tee launcher.txt
          { echo '```'; cat launcher.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect binaries
        run: |
          mkdir -p out
          cp .pio/build/${{ matrix.environment }}/firmware.bin out/${{ matrix.environment }}.bin
          cp .pio/build/${{ matrix.environment }}/firmware-merged.bin out/${{ matrix.environment }}-merged.bin
          cp build.log out/${{ matrix.environment }}-build.log

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.environment }}
          path: out/

  dual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || '' }}
          submodules: true
          fetch-depth: 0       # tags: the firmware version comes from git describe (tools/version.py)

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build both firmwares (dual image)
        run: pio run -e cardputer_adv_dual_standalone -e cardputer_adv_dual_companion | tee build.log

      - name: Assemble firmware-dual.bin
        run: |
          python3 tools/make_dual.py | tee dual.txt
          { echo '### cardputer_adv_dual'; echo '```'; grep -E '^(RAM|Flash):' build.log; cat dual.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p out
          cp .pio/build/firmware-dual.bin out/cardputer_adv_dual-merged.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-cardputer_adv_dual
          path: out/

  release:
    needs: [simulator, firmware, dual]
    # Every published release, whatever its tag (v0.7.0 used to be skipped silently: RELEASE-6).
    # A workflow_call run keeps its caller's event name, so the MeshCore update check never publishes.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check the tag name
        run: |
          echo "Release tag: $TAG"
          if ! [[ "$TAG" =~ ^(cardputer-)?v[0-9]+\.[0-9]+\.[0-9]+([-.+].*)?$ ]]; then
            echo "::warning::Tag '$TAG' is not vX.Y.Z; files will be named after it anyway"
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0       # tags and history: the roadmap summary compares with the previous release

      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: out

      - name: Keep the full-flash images only
        run: |
          mkdir -p release
          VERSION="${TAG#cardputer-}"
          VERSION="${VERSION//\//-}"      # a '/' in the tag cannot go in a file name
          for f in out/*-merged.bin; do
            n=$(basename "$f" -merged.bin)
            cp "$f" "release/${n}-${VERSION}.bin"
          done
          ls -la release

      - name: Release notes (file list + roadmap summary)
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --match 'cardputer-v[0-9]*' "${TAG}^" 2>/dev/null || true)
          {
            echo "## Files"
            echo
            echo "Every file is a full image: flash it at address **0x0**"
            echo "(for instance with ESPConnect: https://thelastoutpostworkshop.github.io/ESPConnect/)."
            echo
            echo "| File | What you get |"
            echo "| --- | --- |"
            echo "| \`cardputer_adv_dual\` | **recommended**: keyboard messenger with offline maps, plus phone mode (Settings › Phone mode; back with esc ×3) |"
            echo "| \`cardputer_adv_standalone\` | keyboard messenger only |"
            echo "| \`cardputer_adv_standalone_map\` | keyboard messenger with offline maps |"
            echo "| \`cardputer_adv_companion_ble\` | phone mode only (official MeshCore companion) |"
            echo "| \`cardputer_adv_demo\` | the whole interface without the LoRa Cap (simulated contacts and GPS) |"
            echo
            echo "Step-by-step guide: app/FLASH.md"
            echo
            if [ -n "$PREV" ]; then python3 tools/roadmap.py --release-summary --since "$PREV"; else python3 tools/roadmap.py --release-summary; fi
          } > release-notes.md
          cat release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          # no name / prerelease: the title and the pre-release box set on GitHub are kept as they are
          append_body: true   # keep the notes written on the release page, add files + roadmap below
          files: release/*.bin
          body_path: release-notes.md
