; Cardputer ADV MeshCore firmwares (standalone keyboard UI, phone companion, dual boot).
;
; MeshCore itself is NOT copied here: it is the git submodule meshcore/, pinned on an official
; release (see README.md "Staying up to date with MeshCore"). Its sources are compiled from meshcore/src,
; its shared settings come from meshcore_base.ini (generated by tools/sync_meshcore_base.py).
; Our code: variant/ (board, display, logs, dual boot) and app/ (keyboard UI, drivers, simulator).

[platformio]
; src_dir is the project root (not meshcore/src): every source then lives under it, so each env
; keeps its own object files in .pio/build/<env>/ (sources outside src_dir would share one folder
; across envs and mix their build flags). MeshCore headers come from -I meshcore/src.
src_dir = .
include_dir = meshcore/include
lib_dir = meshcore/lib
boards_dir = boards
default_envs = cardputer_adv_standalone
extra_configs =
  meshcore_base.ini
  platformio.local.ini

; M5Stack Cardputer ADV (ESP32-S3FN8, 8 MB flash, no PSRAM) + Cap LoRa-1262 / LoRa868.
; Pinout: see CLAUDE.md. Display/keyboard/speaker/battery through M5Unified.

[cardputer_adv_base]
extends = esp32_base
board = m5stack_cardputer_adv
board_build.partitions = default_8MB.csv
; firmware version from git (tools/version.py) + real build date in the app descriptor (RELEASE-7)
extra_scripts =
  ${esp32_base.extra_scripts}
  pre:tools/pio_version.py
build_flags =
  ${esp32_base.build_flags}
  -I meshcore/src
  -I variant
  -D M5STACK_CARDPUTER_ADV
  -D CORE_DEBUG_LEVEL=1
  -D PIN_USER_BTN=0            ; G0 button on the side
  -D PIN_BOARD_SDA=2           ; Wire = Grove port (internal bus 8/9 belongs to M5Unified)
  -D PIN_BOARD_SCL=1
  -D PIN_SD_CS=12
  ; --- SX1262 on the Cap (EXT 14-pin bus) ---
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_NSS=5
  -D P_LORA_DIO_1=4
  -D P_LORA_RESET=3
  -D P_LORA_BUSY=6
  -D P_LORA_SCLK=40
  -D P_LORA_MISO=39
  -D P_LORA_MOSI=14
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=3.0   ; M5Stack example value (falls back to 0 V on error)
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  ; --- GPS on the Cap (MeshCore naming: PIN_GPS_TX = pin wired to the GPS TX = ESP RX) ---
  -D ENV_INCLUDE_GPS=1
  -D PIN_GPS_TX=15
  -D PIN_GPS_RX=13
  -D GPS_BAUD_RATE=115200
  ; no I2C environment sensors on this device
  -D ENV_INCLUDE_AHTX0=0
  -D ENV_INCLUDE_BME280=0
  -D ENV_INCLUDE_BMP280=0
  -D ENV_INCLUDE_SHTC3=0
  -D ENV_INCLUDE_SHT4X=0
  -D ENV_INCLUDE_LPS22HB=0
  -D ENV_INCLUDE_INA3221=0
  -D ENV_INCLUDE_INA219=0
  -D ENV_INCLUDE_INA226=0
  -D ENV_INCLUDE_INA260=0
  -D ENV_INCLUDE_MLX90614=0
  -D ENV_INCLUDE_VL53L0X=0
  -D ENV_INCLUDE_BME680=0
  -D ENV_INCLUDE_BMP085=0
build_src_filter = ${esp32_base.build_src_filter}
  +<variant/>
  +<meshcore/src/helpers/sensors/*.cpp>
  +<app/core/drivers/Pi4ioe.cpp>
  +<app/core/drivers/Tca8418.cpp>
  +<app/core/KeyMatrix.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  m5stack/M5Unified @ ^0.2.10
  m5stack/M5GFX @ ^0.2.15

; Official MeshCore companion firmware (phone app over Bluetooth), with the stock
; companion screen scaled to the Cardputer display. Phase 1 bring-up target.
[env:cardputer_adv_companion_ble]
extends = cardputer_adv_base
build_flags =
  ${cardputer_adv_base.build_flags}
  -I meshcore/examples/companion_radio/ui-new
  -D DISPLAY_CLASS=CardputerDisplay
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=20
  -D OFFLINE_QUEUE_SIZE=64
  -D BLE_PIN_CODE=123456   ; random PIN shown on screen
  -D BLE_DEBUG_LOGGING=1
  -D MESH_DEBUG=1          ; MeshCore's own logs (GPS detection, packets) on the USB serial
  -D CPADV_FW_NAME='"MeshCore Cardputer ADV - companion BLE"'
build_src_filter = ${cardputer_adv_base.build_src_filter}
  +<meshcore/src/helpers/esp32/*.cpp>
  +<meshcore/src/helpers/ui/MomentaryButton.cpp>
  +<meshcore/examples/companion_radio/*.cpp>
  +<meshcore/examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${cardputer_adv_base.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Standalone firmware: keyboard UI from app/ (no phone needed).
; Without the offline map (lighter); see cardputer_adv_standalone_map for the map version.
; Phase 4: messaging (conversations, chat, ACK + retries, contacts, channels), GPS and compass.
[env:cardputer_adv_standalone]
extends = cardputer_adv_base
; 2.5 MB app + 5.4 MB LittleFS, also M5Launcher-friendly (see the csv)
board_build.partitions = variant/partitions_cpadv_8mb.csv
build_flags =
  ${cardputer_adv_base.build_flags}
  -D CPADV_FW_NAME='"MeshCore Cardputer ADV - standalone"'
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
build_src_filter = ${cardputer_adv_base.build_src_filter}
  +<app/core/>
  +<app/device/>
lib_deps =
  ${cardputer_adv_base.lib_deps}
  densaugeo/base64 @ ~1.4.0
  SD

; Same firmware + offline map from the SD card (optional feature).
[env:cardputer_adv_standalone_map]
extends = env:cardputer_adv_standalone
build_flags =
  ${env:cardputer_adv_standalone.build_flags}
  -D CPADV_MAP=1
lib_deps =
  ${env:cardputer_adv_standalone.lib_deps}

; Demo firmware for the Cardputer ADV alone (no LoRa Cap): the whole interface with simulated
; contacts that chat and reply, and a simulated GPS walking around Colomiers. Map included.
[env:cardputer_adv_demo]
extends = env:cardputer_adv_standalone_map
custom_cpadv_version_suffix = -demo
build_flags =
  ${env:cardputer_adv_standalone_map.build_flags}
  -D CPADV_DEMO=1
  -D CPADV_CAP_POWER_PIN=-1

; ---------------------------------------------------------------------------------------------
; Dual-boot image: standalone keyboard firmware (app0) + phone companion (app1) in one flash.
; Build both envs, then: python3 tools/make_dual.py  ->  .pio/build/firmware-dual.bin (flash at 0x0)
; Settings > "Mode téléphone" restarts into the companion; esc pressed 3 times comes back.
[env:cardputer_adv_dual_standalone]
extends = env:cardputer_adv_standalone_map
board_build.partitions = variant/partitions_cpadv_dual.csv
build_flags =
  ${env:cardputer_adv_standalone_map.build_flags}
  -D CPADV_DUAL=1

[env:cardputer_adv_dual_companion]
extends = env:cardputer_adv_companion_ble
board_build.partitions = variant/partitions_cpadv_dual.csv
build_flags =
  ${env:cardputer_adv_companion_ble.build_flags}
  -D CPADV_DUAL=1
